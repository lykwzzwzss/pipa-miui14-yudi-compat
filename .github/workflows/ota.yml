name: Publish stable OTA
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag, for example v1.0.0
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: stable-ota
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Validate published module and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/update_ota.py --repository "$REPOSITORY" --tag "$RELEASE_TAG"
      - name: Commit OTA metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json changelogs/
          if ! git diff --cached --quiet; then
            git commit -m 'Update stable OTA metadata'
            git push origin HEAD:main
          fi
